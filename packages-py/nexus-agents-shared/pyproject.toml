[project]
name = "nexus-agents-shared"
version = "0.1.0"
description = "Shared Pydantic contracts for NexusAI multi-agent services"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_agents_shared"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E402", "F401", "F403", "F841", "UP007"]
