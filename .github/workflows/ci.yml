name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Install dependencies + generate Prisma client ────────────
  install:
    name: Install & generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @nexusai/db exec prisma generate
        continue-on-error: true

      - name: Build shared packages
        run: |
          pnpm --filter @nexusai/shared build    || true
          pnpm --filter @nexusai/llm-router build || true
          pnpm --filter @nexusai/db build        || true

  # ─── Optional TypeScript typecheck — advisory only ─────────────
  typecheck:
    name: Typecheck (advisory)
    runs-on: ubuntu-latest
    needs: install
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma
        run: pnpm --filter @nexusai/db exec prisma generate
        continue-on-error: true

      - name: Build deps
        run: |
          pnpm --filter @nexusai/shared build    || true
          pnpm --filter @nexusai/llm-router build || true
          pnpm --filter @nexusai/db build        || true

      - name: Typecheck
        run: pnpm typecheck
        continue-on-error: true

  # ─── Optional Python lint — advisory only ──────────────────────
  python:
    name: Python lint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check apps/rag apps/evals apps/manager packages-py --output-format=github
        continue-on-error: true

  # ─── Python tests — enforced, not advisory ─────────────────────
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexusai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexusai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install evals service and test deps
        working-directory: apps/evals
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run evals tests
        working-directory: apps/evals
        env:
          # Exercises the database-backed suite as well as the pure unit tests.
          DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexusai
          EVALS_TEST_DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexusai
        run: python -m pytest -q

      - name: Install the manager service
        working-directory: apps/manager
        run: |
          pip install -e ../../packages-py/nexus-agents-shared
          pip install -e ".[dev]"

      - name: Run manager tests
        working-directory: apps/manager
        env:
          DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexusai
        # Integration tests reach the live internet and real models; they run in the
        # nightly eval workflow, not on every push.
        run: python -m pytest -q -m "not integration"
