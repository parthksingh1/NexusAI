[project]
name = "nexusai-evals"
version = "0.1.0"
description = "NexusAI agent evaluation service (suites, scorers, regression gates)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "httpx>=0.27.2",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "openai>=1.51.0",
    "google-generativeai>=0.8.2",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "numpy>=2.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E402", "F401", "F403", "F841", "UP007"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
